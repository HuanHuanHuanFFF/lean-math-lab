name: B699 controlled local power genuine LP proof
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: b699-controlled-proof
  cancel-in-progress: false
jobs:
  scoped:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      B699_RUNTIME: research/tasks/B699-Binomial/runs/20261001-lean-nonr7-01a0f779/continuations/20261005-local-power-ninetymin/runtime
    steps:
      - name: Admit this run and source before checkout
        run: |
          task_job_start=$(date -u +%s)
          test "$task_job_start" -ge "$(date -u -d '2026-10-05 08:04:27 UTC' +%s)" || exit 124
          test "$task_job_start" -le "$(date -u -d '2026-10-05 09:20:00 UTC' +%s)" || exit 124
          echo "B699_ADMITTED_JOB_START_EPOCH=$task_job_start" >> "$GITHUB_ENV"
          echo "B699_ADMITTED_JOB_RUN_ID=$GITHUB_RUN_ID" >> "$GITHUB_ENV"
          echo "B699_ADMITTED_JOB_SOURCE_SHA=$GITHUB_SHA" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Actual resource and fixed source preflight
        id: plan
        run: python3 "$B699_RUNTIME/main-stage.py" preflight
      - uses: leanprover/lean-action@50fcf42d2e460296f1a34b402e990d1b24f8b596
        with:
          auto-config: 'false'
          build: 'false'
          test: 'false'
          lint: 'false'
          use-mathlib-cache: 'false'
          use-github-cache: 'false'
      - name: Focused Mathlib cache and representative import
        id: prepare
        env:
          B699_ARTIFACT_TOKEN: ${{ github.token }}
        run: python3 "$B699_RUNTIME/main-stage.py" prepare
      - name: Fresh rootwidth producer and independent literal
        if: always() && steps.prepare.outcome == 'success' && steps.plan.outputs.rootwidth_enabled == 'true'
        run: python3 "$B699_RUNTIME/main-stage.py" rootwidth
      - name: Preserve rootwidth complete or failed checkpoint
        if: always()
        run: python3 "$B699_RUNTIME/main-stage.py" package-rootwidth
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: b699-ninetymin-rootwidth-${{ github.sha }}-${{ github.run_id }}
          path: .tools/b699-lean-20261001-01a0f779/20261005-local-power-ninetymin/main-runtime/rootwidth-delivery/
          if-no-files-found: warn
          retention-days: 30
      - name: Fresh thetainterval producer and independent literal
        if: always() && steps.prepare.outcome == 'success' && steps.plan.outputs.thetainterval_enabled == 'true'
        run: python3 "$B699_RUNTIME/main-stage.py" thetainterval
      - name: Preserve thetainterval complete or failed checkpoint
        if: always()
        run: python3 "$B699_RUNTIME/main-stage.py" package-thetainterval
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: b699-ninetymin-thetainterval-${{ github.sha }}-${{ github.run_id }}
          path: .tools/b699-lean-20261001-01a0f779/20261005-local-power-ninetymin/main-runtime/thetainterval-delivery/
          if-no-files-found: warn
          retention-days: 30
      - name: Fresh finitesums producer and independent literal
        if: always() && steps.prepare.outcome == 'success' && steps.plan.outputs.finitesums_enabled == 'true'
        run: python3 "$B699_RUNTIME/main-stage.py" finitesums
      - name: Preserve finitesums complete or failed checkpoint
        if: always()
        run: python3 "$B699_RUNTIME/main-stage.py" package-finitesums
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: b699-ninetymin-finitesums-${{ github.sha }}-${{ github.run_id }}
          path: .tools/b699-lean-20261001-01a0f779/20261005-local-power-ninetymin/main-runtime/finitesums-delivery/
          if-no-files-found: warn
          retention-days: 30
      - name: Fresh master producer and independent literal
        if: always() && steps.prepare.outcome == 'success' && steps.plan.outputs.master_enabled == 'true'
        run: python3 "$B699_RUNTIME/main-stage.py" master
      - name: Preserve master complete or failed checkpoint
        if: always()
        run: python3 "$B699_RUNTIME/main-stage.py" package-master
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: b699-ninetymin-master-${{ github.sha }}-${{ github.run_id }}
          path: .tools/b699-lean-20261001-01a0f779/20261005-local-power-ninetymin/main-runtime/master-delivery/
          if-no-files-found: warn
          retention-days: 30
