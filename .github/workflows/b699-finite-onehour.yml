name: B699 full finite one-hour scoped verification

on:
  push:
    branches: [huan/b699-lean-next-20261002-01a0f779]
    paths:
      - .github/workflows/b699-finite-onehour.yml
      - research/tasks/B699-Binomial/runs/20261001-lean-nonr7-01a0f779/continuations/20261002-finite-full-onehour/runtime/full-stage.py
      - research/tasks/B699-Binomial/runs/20261001-lean-nonr7-01a0f779/continuations/20261002-finite-full-onehour/runtime/full-stage-spec.json
      - research/tasks/B699-Binomial/runs/20261001-lean-nonr7-01a0f779/continuations/20261002-finite-full-onehour/runtime/linux-runner.py
      - research/tasks/B699-Binomial/runs/20261001-lean-nonr7-01a0f779/continuations/20261002-finite-full-onehour/runtime/linux-source-manifest.json
      - research/tasks/B699-Binomial/runs/20261001-lean-nonr7-01a0f779/continuations/20261002-finite-full-onehour/finite/generate_ci_batches.py
      - research/tasks/B699-Binomial/runs/20261001-lean-nonr7-01a0f779/continuations/20261002-finite-full-onehour/finite/FiniteSupplyOnly.lean
      - research/tasks/B699-Binomial/runs/20261001-lean-nonr7-01a0f779/continuations/20261002-finite-full-onehour/finite/ChainTerminal.lean
      - research/tasks/B699-Binomial/runs/20261001-lean-nonr7-01a0f779/continuations/20261002-finite-full-onehour/semantic/FiniteSupplyOnlyTyped.lean
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scoped:
    runs-on: ubuntu-latest
    timeout-minutes: 48
    env:
      B699_RUNTIME: research/tasks/B699-Binomial/runs/20261001-lean-nonr7-01a0f779/continuations/20261002-finite-full-onehour/runtime
    steps:
      - name: Reject late start before checkout or installation
        shell: bash
        run: |
          echo "B699_JOB_START_EPOCH=$(date -u +%s)" >> "$GITHUB_ENV"
          test "$(date -u +%s)" -le "$(date -u -d '2026-10-02 12:15:45 UTC' +%s)" || { echo 'Late start: no checkout, install, or proof work permitted'; exit 124; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Record actual runner resources and fixed source bytes
        run: python3 "$B699_RUNTIME/linux-runner.py" preflight
      - uses: leanprover/lean-action@50fcf42d2e460296f1a34b402e990d1b24f8b596
        with:
          auto-config: 'false'
          build: 'false'
          test: 'false'
          lint: 'false'
          use-mathlib-cache: 'false'
          use-github-cache: 'false'
      - name: Fixed NormNum probe then budget-gated full finite verification
        run: python3 "$B699_RUNTIME/full-stage.py"
      - name: Preserve ordinary raw receipts and byte manifest
        if: always()
        run: python3 "$B699_RUNTIME/full-stage.py" manifest
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: b699-finite-retry-onehour-${{ github.sha }}-${{ github.run_id }}
          path: .tools/b699-lean-20261001-01a0f779/20261002-finite-full-onehour/runtime/full-normnum/evidence/
          if-no-files-found: warn
          retention-days: 30
