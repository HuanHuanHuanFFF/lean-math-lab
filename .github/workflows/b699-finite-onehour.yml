name: B699 same-source final four consumers
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: b699-controlled-proof
  cancel-in-progress: false
jobs:
  scoped:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    env:
      B699_RUNTIME: research/tasks/B699-Binomial/runs/20261001-lean-nonr7-01a0f779/continuations/20261004-tail-twohour-finish/runtime/tiny
    steps:
      - name: Reject expired tiny launch window
        run: |
          test "$(date -u +%s)" -le "$(date -u -d '2026-10-04 14:54:00 UTC' +%s)" || { echo 'Late start rejected'; exit 124; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Frozen four source and actual resource preflight
        id: plan
        run: python3 "$B699_RUNTIME/tiny-stage.py" preflight
      - uses: leanprover/lean-action@50fcf42d2e460296f1a34b402e990d1b24f8b596
        with:
          auto-config: 'false'
          build: 'false'
          test: 'false'
          lint: 'false'
          use-mathlib-cache: 'false'
          use-github-cache: 'false'
      - name: Restore six exact origins and331source objects
        env:
          B699_ARTIFACT_TOKEN: ${{ github.token }}
        run: python3 "$B699_RUNTIME/tiny-stage.py" prepare
      - name: Close exact full finite initial
        if: success() && steps.plan.outputs.fullinitial_enabled == 'true'
        run: python3 "$B699_RUNTIME/tiny-stage.py" fullinitial
      - name: Preserve full initial tiny package
        if: always() && steps.plan.outputs.fullinitial_enabled == 'true'
        run: python3 "$B699_RUNTIME/tiny-stage.py" package-fullinitial
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always() && steps.plan.outputs.fullinitial_enabled == 'true'
        with:
          name: b699-tail2h-tinyfullinitial-${{ github.sha }}-${{ github.run_id }}
          path: .tools/b699-lean-20261001-01a0f779/20261004-tail-twohour-finish/tiny-runtime/fullinitial-delivery/
          if-no-files-found: warn
          retention-days: 30
      - name: Close exact original consumers through30000
        if: success() && steps.plan.outputs.tail30000_enabled == 'true'
        run: python3 "$B699_RUNTIME/tiny-stage.py" tail30000
      - name: Preserve final four consumer tiny package
        if: always() && steps.plan.outputs.tail30000_enabled == 'true'
        run: python3 "$B699_RUNTIME/tiny-stage.py" package-tail30000
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always() && steps.plan.outputs.tail30000_enabled == 'true'
        with:
          name: b699-tail2h-tinytail30000-${{ github.sha }}-${{ github.run_id }}
          path: .tools/b699-lean-20261001-01a0f779/20261004-tail-twohour-finish/tiny-runtime/tail30000-delivery/
          if-no-files-found: warn
          retention-days: 30
