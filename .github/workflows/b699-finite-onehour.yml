name: B699 finite retry one-hour scoped verification

on:
  push:
    branches: [huan/b699-lean-next-20261002-01a0f779]
    paths:
      - .github/workflows/b699-finite-onehour.yml
      - research/tasks/B699-Binomial/runs/20261001-lean-nonr7-01a0f779/continuations/20261002-finite-onehour/finite/ChainCore.lean
      - research/tasks/B699-Binomial/runs/20261001-lean-nonr7-01a0f779/continuations/20261002-finite-onehour/finite/Pilot32.lean
      - research/tasks/B699-Binomial/runs/20261001-lean-nonr7-01a0f779/continuations/20261002-finite-onehour/finite/PilotConsumer.lean
      - research/tasks/B699-Binomial/runs/20261001-lean-nonr7-01a0f779/continuations/20261002-finite-onehour/semantic/OriginalPilotTyped.lean
      - research/tasks/B699-Binomial/runs/20261001-lean-nonr7-01a0f779/continuations/20261002-finite-onehour/semantic/NewChainTyped.lean
      - research/tasks/B699-Binomial/runs/20261001-lean-nonr7-01a0f779/continuations/20261002-finite-retry-onehour/runtime/linux-runner.py
      - research/tasks/B699-Binomial/runs/20261001-lean-nonr7-01a0f779/continuations/20261002-finite-retry-onehour/runtime/linux-source-manifest.json
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scoped:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      B699_RUNTIME: research/tasks/B699-Binomial/runs/20261001-lean-nonr7-01a0f779/continuations/20261002-finite-retry-onehour/runtime
    steps:
      - name: Reject late start before checkout or installation
        shell: bash
        run: |
          test "$(date -u +%s)" -le "$(date -u -d '2026-10-02 11:46:22 UTC' +%s)" || { echo 'Late start: no checkout, install, or proof work permitted'; exit 124; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Record actual runner resources and fixed source bytes
        run: python3 "$B699_RUNTIME/linux-runner.py" preflight
      - uses: leanprover/lean-action@50fcf42d2e460296f1a34b402e990d1b24f8b596
        with:
          auto-config: 'false'
          build: 'false'
          test: 'false'
          lint: 'false'
          use-mathlib-cache: 'false'
          use-github-cache: 'false'
      - name: Fetch only three fixed import closures
        run: python3 "$B699_RUNTIME/linux-runner.py" cache
      - name: Compile fixed ten-source closure, refuse unexpected axioms, replay root
        run: python3 "$B699_RUNTIME/linux-runner.py" build
      - name: Preserve ordinary raw receipts and byte manifest
        if: always()
        run: python3 "$B699_RUNTIME/linux-runner.py" manifest
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: b699-finite-retry-onehour-${{ github.sha }}-${{ github.run_id }}
          path: .tools/b699-lean-20261001-01a0f779/20261002-finite-retry-onehour/runtime/evidence/
          if-no-files-found: warn
          retention-days: 30
