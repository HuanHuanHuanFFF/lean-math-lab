name: B699 controlled two-hour tail verification
on:
  workflow_dispatch:
  push:
    branches: ['huan/b699-lean-next-20261002-01a0f779']
    paths:
      - 'research/tasks/B699-Binomial/runs/20261001-lean-nonr7-01a0f779/continuations/20261004-tail-twohour-finish/runtime/stage-spec.json'
      - 'research/tasks/B699-Binomial/runs/20261001-lean-nonr7-01a0f779/continuations/20261004-tail-twohour-finish/runtime/tail-stage.py'
permissions:
  contents: read
concurrency:
  group: b699-controlled-proof
  cancel-in-progress: false
jobs:
  scoped:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    env:
      B699_RUNTIME: research/tasks/B699-Binomial/runs/20261001-lean-nonr7-01a0f779/continuations/20261004-tail-twohour-finish/runtime
    steps:
      - name: Reject expired absolute launch window
        shell: bash
        run: |
          test "$(date -u +%s)" -le "$(date -u -d '2026-10-04 13:55:00 UTC' +%s)" || { echo 'Late start rejected'; exit 124; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Actual resources and frozen stage sources
        id: plan
        run: python3 "$B699_RUNTIME/tail-stage.py" preflight
      - uses: leanprover/lean-action@50fcf42d2e460296f1a34b402e990d1b24f8b596
        with:
          auto-config: 'false'
          build: 'false'
          test: 'false'
          lint: 'false'
          use-mathlib-cache: 'false'
          use-github-cache: 'false'
      - name: Restore four exact accepted origins and195source objects
        env:
          B699_ARTIFACT_TOKEN: ${{ github.token }}
        run: python3 "$B699_RUNTIME/tail-stage.py" prepare
      - name: Complete finite original consumers through 10001
        if: success() && steps.plan.outputs.stage10001_enabled == 'true'
        run: python3 "$B699_RUNTIME/tail-stage.py" stage10001
      - name: Preserve independent 10001 closed or failed stage
        if: always() && steps.plan.outputs.stage10001_enabled == 'true'
        run: python3 "$B699_RUNTIME/tail-stage.py" package-stage10001
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always() && steps.plan.outputs.stage10001_enabled == 'true'
        with:
          name: b699-tail2h-stage10001-${{ github.sha }}-${{ github.run_id }}
          path: .tools/b699-lean-20261001-01a0f779/20261004-tail-twohour-finish/runtime/stage10001-delivery/
          if-no-files-found: warn
          retention-days: 30
      - name: Complete finite original consumers through 13000
        if: success() && steps.plan.outputs.stage13000_enabled == 'true'
        run: python3 "$B699_RUNTIME/tail-stage.py" stage13000
      - name: Preserve independent 13000 closed or failed stage
        if: always() && steps.plan.outputs.stage13000_enabled == 'true'
        run: python3 "$B699_RUNTIME/tail-stage.py" package-stage13000
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always() && steps.plan.outputs.stage13000_enabled == 'true'
        with:
          name: b699-tail2h-stage13000-${{ github.sha }}-${{ github.run_id }}
          path: .tools/b699-lean-20261001-01a0f779/20261004-tail-twohour-finish/runtime/stage13000-delivery/
          if-no-files-found: warn
          retention-days: 30
      - name: Complete finite original consumers through 15000
        if: success() && steps.plan.outputs.stage15000_enabled == 'true'
        run: python3 "$B699_RUNTIME/tail-stage.py" stage15000
      - name: Preserve independent 15000 closed or failed stage
        if: always() && steps.plan.outputs.stage15000_enabled == 'true'
        run: python3 "$B699_RUNTIME/tail-stage.py" package-stage15000
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always() && steps.plan.outputs.stage15000_enabled == 'true'
        with:
          name: b699-tail2h-stage15000-${{ github.sha }}-${{ github.run_id }}
          path: .tools/b699-lean-20261001-01a0f779/20261004-tail-twohour-finish/runtime/stage15000-delivery/
          if-no-files-found: warn
          retention-days: 30
