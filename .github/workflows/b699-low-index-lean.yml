name: B699 fixed FiniteCover environment

on:
  push:
    branches: ['GPT-work/b699-low-index-lean-20260911-513dc7cc']
    paths:
      - '.github/workflows/b699-low-index-lean.yml'
      - 'research/tasks/B699-Binomial/runs/20260911-low-index-lean-513dc7cc/verification/runner/**'
  workflow_dispatch:

permissions:
  contents: read

env:
  B699_RUN: 'research/tasks/B699-Binomial/runs/20260911-low-index-lean-513dc7cc'

jobs:
  finitecover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Observe resources before installation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import shutil, subprocess
          for name in ('memory.max', 'memory.current', 'cpu.max'):
              p = Path('/sys/fs/cgroup') / name
              print(name, p.read_text().strip() if p.exists() else 'unavailable')
          print('disk', shutil.disk_usage('.'))
          print(subprocess.check_output(['ps', '-eo', 'pid,ppid,rss,comm', '--sort=-rss'], text=True)[:1500])
          PY
      - uses: leanprover/lean-action@50fcf42d2e460296f1a34b402e990d1b24f8b596
        with:
          auto-config: 'false'
          build: 'false'
          test: 'false'
          lint: 'false'
          use-mathlib-cache: 'false'
          use-github-cache: 'false'
      - name: Restore fixed target import closure
        run: python3 "$B699_RUN/verification/runner/verify_environment.py" --repo . --mode cache
      - name: Compile minimal import and fresh FiniteCover closure with std3 audit
        run: >-
          python3 "$B699_RUN/verification/runner/verify_environment.py"
          --repo . --mode verify --run-dir "$B699_RUN"
          --memory-mb 3072 --command-timeout 900
      - name: Preserve actual source, compile and transitive axiom evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: b699-finitecover-environment-evidence
          path: ${{ env.B699_RUN }}/verification/20*
          if-no-files-found: warn
