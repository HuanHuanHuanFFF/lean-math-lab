name: B699 smooth window Lean acceptance
on:
  push:
    branches: ['GPT-work/b699-smooth-window-lean-20260911-894d6b50']
    paths:
      - '.github/workflows/b699-smooth-window.yml'
      - 'research/tasks/B699-Binomial/runs/20260911-smooth-window-lean-894d6b50/lean/**'
      - 'research/tasks/B699-Binomial/runs/20260911-smooth-window-lean-894d6b50/verification/runner/**'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
env:
  B699_RUN: 'research/tasks/B699-Binomial/runs/20260911-smooth-window-lean-894d6b50'
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Record source and resources
        run: |
          mkdir -p "$B699_RUN/verification/current"
          git rev-parse HEAD > "$B699_RUN/verification/current/source-sha.txt"
          free -h > "$B699_RUN/verification/current/resources.txt"
          df -h . >> "$B699_RUN/verification/current/resources.txt"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: b699-smooth-window-runtime
          run-id: 34571295626
          github-token: ${{ github.token }}
          path: .tools/smooth-window-import
      - name: Restore the exact bootstrap runtime
        run: |
          tar --zstd -xf .tools/smooth-window-import/runtime.tar.zst
          echo "ELAN_HOME=$GITHUB_WORKSPACE/.elan" >> "$GITHUB_ENV"
          echo "$GITHUB_WORKSPACE/.elan/bin" >> "$GITHUB_PATH"
      - name: Compile sources and enforce transitive std3 audits
        continue-on-error: true
        run: |
          lake env lean --version
          python3 "$B699_RUN/verification/runner/compile.py"
      - name: Split runtime into supported binary artifacts
        run: |
          mkdir -p .tools/smooth-window-parts
          split -b 400M -d -a 2 .tools/smooth-window-import/runtime.tar.zst .tools/smooth-window-parts/runtime.part-
          sha256sum .tools/smooth-window-parts/runtime.part-* > "$B699_RUN/verification/current/runtime-parts.sha256"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: b699-smooth-runtime-00
          path: .tools/smooth-window-parts/runtime.part-00
          compression-level: 0
          retention-days: 3
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: b699-smooth-runtime-01
          path: .tools/smooth-window-parts/runtime.part-01
          compression-level: 0
          retention-days: 3
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: b699-smooth-runtime-02
          path: .tools/smooth-window-parts/runtime.part-02
          compression-level: 0
          retention-days: 3
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: b699-smooth-runtime-03
          path: .tools/smooth-window-parts/runtime.part-03
          compression-level: 0
          retention-days: 3
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: b699-smooth-runtime-04
          path: .tools/smooth-window-parts/runtime.part-04
          compression-level: 0
          retention-days: 3
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: b699-smooth-window-evidence
          path: ${{ env.B699_RUN }}/verification/current
          retention-days: 30
          if-no-files-found: error
      - name: Require complete compile and audit success
        if: always()
        run: test "$(cat "$B699_RUN/verification/current/complete.exit")" = 0
