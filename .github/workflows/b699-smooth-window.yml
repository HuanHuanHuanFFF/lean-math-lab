name: B699 smooth window Lean acceptance
on:
  push:
    branches: ['GPT-work/b699-smooth-window-lean-20260911-894d6b50']
    paths:
      - '.github/workflows/b699-smooth-window.yml'
      - 'research/tasks/B699-Binomial/runs/20260911-smooth-window-lean-894d6b50/lean/**'
      - 'research/tasks/B699-Binomial/runs/20260911-smooth-window-lean-894d6b50/verification/runner/**'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
env:
  B699_RUN: 'research/tasks/B699-Binomial/runs/20260911-smooth-window-lean-894d6b50'
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Record source and resources
        run: |
          mkdir -p "$B699_RUN/verification/current"
          git rev-parse HEAD > "$B699_RUN/verification/current/source-sha.txt"
          free -h > "$B699_RUN/verification/current/resources.txt"
          df -h . >> "$B699_RUN/verification/current/resources.txt"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: b699-smooth-window-runtime
          run-id: 34571295626
          github-token: ${{ github.token }}
          path: .tools/smooth-window-import
      - name: Restore the exact bootstrap runtime
        run: |
          tar --zstd -xf .tools/smooth-window-import/runtime.tar.zst
          echo "ELAN_HOME=$GITHUB_WORKSPACE/.elan" >> "$GITHUB_ENV"
          echo "$GITHUB_WORKSPACE/.elan/bin" >> "$GITHUB_PATH"
      - name: Compile sources and enforce transitive std3 audits
        continue-on-error: true
        run: |
          lake env lean --version
          python3 "$B699_RUN/verification/runner/compile.py"
      - name: Create smaller artifacts only for the two timed-out runtime ranges
        run: |
          python3 - <<'PY'
          from pathlib import Path
          dest=Path(".tools/smooth-window-small")
          dest.mkdir(parents=True,exist_ok=True)
          with open(".tools/smooth-window-import/runtime.tar.zst","rb") as src:
              for part in (1,3):
                  src.seek(part*400*1024*1024)
                  for sub in range(4):
                      data=src.read(100*1024*1024)
                      assert len(data)==100*1024*1024
                      (dest/f"runtime.small-{part:02d}-{sub:02d}").write_bytes(data)
          PY
          sha256sum .tools/smooth-window-small/* > "$B699_RUN/verification/current/runtime-small.sha256"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: b699-smooth-small-01-00
          path: .tools/smooth-window-small/runtime.small-01-00
          compression-level: 0
          retention-days: 3
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: b699-smooth-small-01-01
          path: .tools/smooth-window-small/runtime.small-01-01
          compression-level: 0
          retention-days: 3
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: b699-smooth-small-01-02
          path: .tools/smooth-window-small/runtime.small-01-02
          compression-level: 0
          retention-days: 3
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: b699-smooth-small-01-03
          path: .tools/smooth-window-small/runtime.small-01-03
          compression-level: 0
          retention-days: 3
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: b699-smooth-small-03-00
          path: .tools/smooth-window-small/runtime.small-03-00
          compression-level: 0
          retention-days: 3
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: b699-smooth-small-03-01
          path: .tools/smooth-window-small/runtime.small-03-01
          compression-level: 0
          retention-days: 3
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: b699-smooth-small-03-02
          path: .tools/smooth-window-small/runtime.small-03-02
          compression-level: 0
          retention-days: 3
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: b699-smooth-small-03-03
          path: .tools/smooth-window-small/runtime.small-03-03
          compression-level: 0
          retention-days: 3
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: b699-smooth-window-evidence
          path: ${{ env.B699_RUN }}/verification/current
          retention-days: 30
          if-no-files-found: error
      - name: Require complete compile and audit success
        if: always()
        run: test "$(cat "$B699_RUN/verification/current/complete.exit")" = 0
